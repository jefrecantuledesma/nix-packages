[package]
name = "vcgt-loader"
version = "0.1.0"
edition = "2021"
description = "Load an ICC profile's vcgt calibration curves into a wlroots output's gamma table"
license = "MIT"

[dependencies]
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["fs"] }

[profile.release]
lto = true
